# Publishes the apps to GitHub Pages together with fresh The Blue Alliance data.
# Setup (once): Settings → Pages → Source: "GitHub Actions", and
#               Settings → Secrets and variables → Actions → New secret TBA_KEY.
# The key stays in GitHub; the website only gets the downloaded data.
name: Deploy site with TBA data

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, but the check job below only lets it deploy while one of the
    # teams in tba-events.txt has an event on. GitHub may run these late when it is busy.
    - cron: "*/30 * * * *"
    - cron: "41 9 * * 1"      # weekly refresh between events (Mondays 09:41 UTC)
  workflow_dispatch:          # "Run workflow" button for an immediate update

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pushes, "Run workflow" and the weekly refresh always deploy. The half-hourly runs
  # deploy only during an event (scripts/event_today.py); otherwise deploy is skipped.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.when.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: when
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$SCHEDULE" = "41 9 * * 1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            site=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url || true)
            echo "run=$(python3 scripts/event_today.py "$site")" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Download TBA data
        env:
          TBA_KEY: ${{ secrets.TBA_KEY }}
        run: |
          if [ -z "$TBA_KEY" ]; then
            echo "::warning::No TBA_KEY secret, so the site is published without TBA data."
          else
            python3 scripts/fetch_tba.py
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
